name: Lottery official PDF recheck
on:
  # Automatic result collection now belongs to Supabase Cron and the shared private cache.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lottery-api-pdf-check
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Verify probe safety without credentials
        run: python3 -m unittest discover -s scripts/lottery-results -p 'test_*.py'
      - name: Recheck missing government PDFs without provider credentials
        run: DRAW_MODE=official python3 scripts/lottery-results/api_schedule.py
      - name: Save validated PDF link metadata only
        run: |
          set -euo pipefail
          git add public/lottery-results/documents.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data(lottery): recheck official draw PDF links'
          git push origin HEAD:main
