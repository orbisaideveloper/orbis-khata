name: Lottery API PDF check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lottery-api-probe.yml', 'scripts/lottery-results/api_probe.py', 'scripts/lottery-results/test_api_probe.py', 'scripts/lottery-results/api_schedule.py', 'scripts/lottery-results/test_api_schedule.py', 'scripts/lottery-results/sikkim_source.py', 'scripts/lottery-results/test_sikkim_source.py']
  schedule:
    # IST13:10,18:10,20:10. GitHub can start late; the worker never polls after :30.
    - cron: '40 7,12,14 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: Draw date (DD-MM-YYYY), blank means yesterday IST
        required: false
        default: ''
        type: string
      slot:
        description: Draw time (IST)
        required: true
        default: '6pm,8pm'
        type: choice
        options: ['1pm', '6pm', '8pm', '6pm,8pm']
permissions:
  contents: write
concurrency:
  group: lottery-api-pdf-check
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Verify probe safety without credentials
        run: python3 -m unittest discover -s scripts/lottery-results -p 'test_*.py'
      - name: Check one draw and publish its public PDF link only
        env:
          SAMBAD_API_TOKEN: ${{ secrets.SAMBAD_API_TOKEN }}
          DRAW_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
          DRAW_DATE: ${{ inputs.date }}
          DRAW_SLOT: ${{ inputs.slot || '6pm,8pm' }}
        run: python3 scripts/lottery-results/api_schedule.py
      - name: Save validated PDF link metadata only
        run: |
          set -euo pipefail
          git add public/lottery-results/documents.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data(lottery): save API-checked draw PDF link'
          git push origin HEAD:main
