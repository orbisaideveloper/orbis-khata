name: Khata Sync v2 Phase 2B Final Five (Disposable Acceptance)
# Acceptance only. Disposable CI branch push/manual run. NEVER deploy or use production secrets.
on:
  workflow_dispatch:
  push:
    branches: [ci/phase2b-final-five-20261126]
    paths:
      - ".github/workflows/sync-v2-phase2b-final-gates.yml"
      - "scripts/sync-v2-*-fixture.mjs"
      - "scripts/run-phase2b-business-cron-docker.sh"
      - "scripts/verify-sync-v2-*.mjs"
      - "tests/sync-v2/phase2b-final-*.test.mjs"
      - "supabase/review-candidates/**"
permissions:
  contents: read
jobs:
  original-four-business-crons:
    name: Real pg_cron dispatch of original four commands
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-fund
      - name: Run the shared disposable Supabase acceptance
        run: bash scripts/run-phase2b-business-cron-docker.sh
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: phase2b-original-business-cron-${{ github.run_id }}
          path: quality-reports/phase2b/
          if-no-files-found: warn
          retention-days: 60
  all-26-and-concurrent-writers:
    name: All 26 trigger effects in one PG17 dataset + concurrent v1/v2
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-only
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: khata_sync_v2_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d khata_sync_v2_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      KHATA_SYNC_V2_TEST_URL: postgres://postgres@127.0.0.1:5432/khata_sync_v2_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-fund
      - name: Run original 26 behavior assertions and simultaneous mixed writers in same database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p quality-reports/phase2b
          node scripts/verify-sync-v2-mixed-26-runtime.mjs \
            2>&1 | tee quality-reports/phase2b/mixed-26-stdout.log
      - name: Preserve evidence on pass or fail
        if: always()
        shell: bash
        run: |
          mkdir -p quality-reports/phase2b
          printf 'run=%s/%s/actions/runs/%s\nsha=%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA" > quality-reports/phase2b/provenance.txt
          sha256sum scripts/verify-sync-v2-mixed-26-runtime.mjs \
            scripts/sync-v2-trigger-behavior-fixture.mjs \
            scripts/verify-sync-v2-combined-writers.mjs > quality-reports/phase2b/sha256.txt
          echo 'NOT Phase 2B final certification: independent per-case review remains required' > quality-reports/phase2b/boundary.txt
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: phase2b-mixed-26-${{ github.run_id }}
          path: quality-reports/phase2b/
          if-no-files-found: warn
          retention-days: 60

  remaining-native-invariant-matrix:
    name: Remaining native acceptance evidence — ${{ matrix.fixture }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Fresh disposable PostgreSQL 17 for each existing source runner.
        fixture: [server-catalog, snapshot, trusted-device, legacy-locks, settlement, company-fence, rollout]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-phase2b-evidence
          POSTGRES_DB: khata_sync_v2_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d khata_sync_v2_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      KHATA_SYNC_V2_TEST_URL: postgres://postgres:disposable-phase2b-evidence@127.0.0.1:5432/khata_sync_v2_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-fund
      - name: Execute existing native acceptance fixture on fresh PG17
        id: fixture
        shell: bash
        env:
          PHASE2B_FIXTURE: ${{ matrix.fixture }}
        run: |
          set -euo pipefail
          mkdir -p quality-reports/phase2b
          node "scripts/verify-sync-v2-${PHASE2B_FIXTURE}.mjs" \
            2>&1 | tee "quality-reports/phase2b/native-${PHASE2B_FIXTURE}.log"
      - name: Record exact SHA and acceptance scope including failures
        if: always()
        shell: bash
        env:
          PHASE2B_FIXTURE: ${{ matrix.fixture }}
          FIXTURE_OUTCOME: ${{ steps.fixture.outcome }}
        run: |
          set -euo pipefail
          mkdir -p quality-reports/phase2b
          {
            echo "sha=$GITHUB_SHA"
            echo "run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "fixture=$PHASE2B_FIXTURE"
            echo "result=$FIXTURE_OUTCOME"
            echo "pg=17 disposable"
            echo "script_sha256=$(sha256sum "scripts/verify-sync-v2-${PHASE2B_FIXTURE}.mjs" | cut -d ' ' -f 1)"
            echo "scope=CANDIDATE_RUNTIME_EVIDENCE_NOT_INDEPENDENTLY_REVIEWED"
            echo "no_claim=NOT_64_GATE_CERTIFICATION"
          } > "quality-reports/phase2b/native-${PHASE2B_FIXTURE}-provenance.txt"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: phase2b-remaining-${{ matrix.fixture }}-${{ github.run_id }}
          path: quality-reports/phase2b/
          retention-days: 60
          if-no-files-found: warn
