name: Lottery official gazettes
on:
  workflow_dispatch:
  schedule:
    # IST 13:15/13:20, 18:15/18:20, 20:15/20:20; GitHub may run late.
    - cron: '45,50 7,12,14 * * *'
permissions:
  contents: write
concurrency:
  group: lottery-result-publications
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Install official PDF readers
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr
      - name: Test collector safety
        run: python3 -m unittest discover -s scripts/lottery-results -p 'test_*.py'
      - name: Collect official gazettes (unreadable results stay pending)
        run: python3 scripts/lottery-results/collect.py
      - name: Save public result feed only
        run: |
          set -euo pipefail
          git add public/lottery-results/feed.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data(lottery): refresh official gazette review status'
          git push origin HEAD:main
