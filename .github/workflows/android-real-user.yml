name: Khata Android Real User Acceptance
on:
  workflow_dispatch:
    inputs:
      confirm_test_only:
        description: Confirm isolated synthetic reviewer-account Android testing
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  android-real-user:
    if: inputs.confirm_test_only == true
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VITE_ORBIS_CUSTOMER_API_URL: ${{ vars.VITE_ORBIS_CUSTOMER_API_URL || 'https://orbis-admin-staging.onrender.com' }}
      VITE_KHATA_DATA_URL: ${{ vars.VITE_KHATA_DATA_URL || 'https://gqyaxsczlmvppxuoqbox.supabase.co/functions/v1/orbis-khata-data' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Check configured reviewer secrets
        env:
          TEST_EMAIL: ${{ secrets.KHATA_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.KHATA_TEST_PASSWORD }}
        run: |
          test -n "$TEST_EMAIL" || { echo 'Missing KHATA_TEST_EMAIL secret'; exit 1; }
          test -n "$TEST_PASSWORD" || { echo 'Missing KHATA_TEST_PASSWORD secret'; exit 1; }
          test "$TEST_EMAIL" = 'orbisaideveloper+playreview@gmail.com' || exit 1
      - name: Prepare runner report directory
        run: mkdir -p "$HOME/storage/downloads"
      - run: npm ci --include=optional
      - name: Validate real-user script and UI test contract
        run: |
          bash -n scripts/android-real-user-run.sh
          python3 scripts/android-real-user-preflight.py
      - run: python3 scripts/khata.py test android
      - run: sudo chown "$(id -un)" /dev/kvm
      - name: Installed APK authenticated reviewer acceptance
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          TEST_EMAIL: ${{ secrets.KHATA_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.KHATA_TEST_PASSWORD }}
          RUN_ID: ${{ github.run_id }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/android-real-user-run.sh
      - name: Preserve failure/success evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: khata-android-real-user-${{ github.run_id }}
          path: android/app/build/reports/real-user/
          if-no-files-found: warn
          retention-days: 14
