name: Khata Android candidate
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'pwa/**'
      - 'capacitor.config.json'
      - 'package*.json'
      - 'scripts/khata*.py'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      signed_release:
        description: Build signed AAB for owner Internal testing; no publication
        type: boolean
        default: false
      version_code:
        description: Increasing Play version code
        type: string
        default: '1'
      version_name:
        description: User-visible release version
        type: string
        default: '1.0.0'
permissions:
  contents: read
concurrency:
  group: khata-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  debug-candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VITE_ORBIS_CUSTOMER_API_URL: ${{ vars.VITE_ORBIS_CUSTOMER_API_URL || 'https://orbis-admin-staging.onrender.com' }}
      VITE_KHATA_DATA_URL: ${{ vars.VITE_KHATA_DATA_URL || 'https://gqyaxsczlmvppxuoqbox.supabase.co/functions/v1/orbis-khata-data' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties
            package-lock.json
      - name: Check existing runner Android SDK
        run: test -f "$ANDROID_HOME/platforms/android-36/android.jar"
      - name: Prepare runner report directory
        run: mkdir -p "$HOME/storage/downloads"
      - run: npm ci --include=optional
      - run: python3 scripts/khata-selftest.py
      - run: npm test -- src/native src/PwaStatus.test.tsx src/auth/AccountForm.test.tsx src/billing/BillShare.test.tsx src/accounting/ledger-export.test.ts src/accounting/ledger-download.test.ts
      - run: python3 scripts/khata.py test android
      - name: Allow this disposable runner to use KVM
        run: |
          test -c /dev/kvm
          sudo chown "$(id -un)" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Android emulator package and startup tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            python3 scripts/khata.py test android-device
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.orbisaideveloper.khata/.MainActivity
            adb shell uiautomator dump /sdcard/khata-window.xml
            mkdir -p android/app/build/reports/native-preview
            adb pull /sdcard/khata-window.xml android/app/build/reports/native-preview/
            adb exec-out screencap -p > android/app/build/reports/native-preview/welcome.png
      - name: Preserve Android diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: khata-android-report-${{ github.sha }}
          path: |
            ~/storage/downloads/ORBIS-KHATA-LATEST-REPORT.txt
            ~/.cache/orbis-khata-quality/android-*.log
            android/app/build/reports/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v5
        with:
          name: khata-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Build and verify owner signed bundle
        if: github.event_name == 'workflow_dispatch' && inputs.signed_release
        env:
          KHATA_UPLOAD_KEYSTORE_BASE64: ${{ secrets.KHATA_UPLOAD_KEYSTORE_BASE64 }}
          KHATA_UPLOAD_STORE_PASSWORD: ${{ secrets.KHATA_UPLOAD_STORE_PASSWORD }}
          KHATA_UPLOAD_KEY_ALIAS: ${{ secrets.KHATA_UPLOAD_KEY_ALIAS }}
          KHATA_UPLOAD_KEY_PASSWORD: ${{ secrets.KHATA_UPLOAD_KEY_PASSWORD }}
          KHATA_ANDROID_VERSION_CODE: ${{ inputs.version_code }}
          KHATA_ANDROID_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          test -n "$KHATA_UPLOAD_KEYSTORE_BASE64"
          python3 scripts/khata.py test android-release
      - name: Preserve verified signed AAB
        if: success() && github.event_name == 'workflow_dispatch' && inputs.signed_release
        uses: actions/upload-artifact@v5
        with:
          name: khata-signed-aab-${{ github.sha }}-${{ inputs.version_code }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
      - name: Preserve signed build result
        if: always() && github.event_name == 'workflow_dispatch' && inputs.signed_release
        uses: actions/upload-artifact@v5
        with:
          name: khata-signed-report-${{ github.sha }}
          path: ~/storage/downloads/ORBIS-KHATA-LATEST-REPORT.txt
          if-no-files-found: warn
          retention-days: 7
      # Signing material exists only in the runner temporary directory during release.
      # No Play publishing, migration, deployment or upload-key artifacts.
